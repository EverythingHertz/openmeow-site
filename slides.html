<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenMeow · Slides</title>
<link rel="stylesheet" href="/slides.css">
<script type="module" src="/slides.mjs"></script>
</head>
<body>
<header class="top">
  <h1>OpenMeow <span>Slides</span></h1>
  <p class="sub">Every slide you have made, newest first. Pick one, ask for one change, keep every version.</p>
</header>
<section class="strip" id="strip" aria-live="polite"><span class="pill">Loading…</span></section>
<main class="grid" id="grid"></main>

<aside class="panel" id="panel" hidden aria-label="Slide detail">
  <div class="panel-head">
    <div>
      <h2 id="p-title"></h2>
      <p class="meta" id="p-meta"></p>
    </div>
    <button class="close" id="p-close" aria-label="Close">×</button>
  </div>
  <img class="hero" id="p-img" alt="">
  <p class="limits" id="p-limits"></p>

  <form id="iter-form" class="iter-form">
    <label for="instruction">One change</label>
    <textarea id="instruction" rows="2" maxlength="500" placeholder="e.g. Make the headline say “See your agents work.”"></textarea>
    <div class="row">
      <button type="submit" id="iterate">Iterate</button>
      <span class="note" id="iter-note"></span>
    </div>
  </form>

  <section class="pending" id="pending" hidden>
    <p class="agent">Agent: <strong>not connected</strong>. Copy this prompt into Claude Code or Codex. The board shows the new version as soon as the agent saves it.</p>
    <pre id="prompt"></pre>
    <button type="button" id="copy">Copy the iterate prompt</button>
  </section>

  <section class="versions" id="versions" hidden>
    <h3>Versions</h3>
    <div class="chips" id="chips"></div>
    <div class="compare" id="compare">
      <figure><img id="c-old" alt=""><figcaption id="c-old-cap"></figcaption></figure>
      <figure><img id="c-new" alt=""><figcaption id="c-new-cap"></figcaption></figure>
    </div>
  </section>
</aside>
</body>
</html>
